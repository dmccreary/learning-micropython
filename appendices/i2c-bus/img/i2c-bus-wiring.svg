<text class="s" x="18" y="294" style="font-weight:bold">Two 4.7 k&#937; pull-up</text>
<text class="s" x="18" y="310" style="font-weight:bold">resistors (the small boxes)</text>
<text class="s" x="18" y="330" style="fill:#555">Most boards already have</text>
<text class="s" x="18" y="346" style="fill:#555">their own pull-ups.</text>
