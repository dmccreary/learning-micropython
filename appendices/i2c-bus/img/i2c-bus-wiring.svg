<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="100%" role="img" aria-labelledby="t d">
<title id="t">Wiring diagram: one Raspberry Pi Pico and five I2C boards sharing four wires</title>
<desc id="d">The Pico pin 36 (3V3 OUT) feeds the 3.3 volt wire, pin 2 (GP1) is the SCL clock wire, pin 1 (GP0) is the SDA data wire and pin 38 is ground. Two 4.7 kilohm pull-up resistors connect SCL and SDA to 3.3 volts. Five boards connect to the same four wires: MPU-6050 at 0x68, HMC5883L at 0x1E, VL53L0X at 0x29, INA219 at 0x40 and SSD1306 at 0x3C.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#222} .t{font-size:15px;font-weight:bold} .s{font-size:12.5px} .p{font-size:12px;text-anchor:end} .c{font-size:13px;text-anchor:middle}</style>
