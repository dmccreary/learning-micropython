<circle cx="168" cy="140" r="5" fill="purple"/>
<text class="s" x="836" y="132" text-anchor="end" style="fill:purple;font-weight:bold">SCL clock</text>
<text class="p" x="158" y="188">GP0 pin 1</text>
<line x1="168" y1="184" x2="836" y2="184" stroke="navy" stroke-width="4"/>
<circle cx="168" cy="184" r="5" fill="navy"/>
<text class="s" x="836" y="176" text-anchor="end" style="fill:navy;font-weight:bold">SDA data</text>
<text class="p" x="158" y="232">GND pin 38</text>
<line x1="168" y1="228" x2="836" y2="228" stroke="black" stroke-width="4"/>
<circle cx="168" cy="228" r="5" fill="black"/>
<text class="s" x="836" y="220" text-anchor="end" style="fill:black;font-weight:bold">GND ground</text>
<line x1="190" y1="96" x2="190" y2="140" stroke="purple" stroke-width="2"/>
