<text class="s" x="93.0" y="78" text-anchor="middle">(the controller)</text>
<text class="p" x="158" y="100">3V3(OUT) pin 36</text>
<line x1="168" y1="96" x2="836" y2="96" stroke="firebrick" stroke-width="4"/>
